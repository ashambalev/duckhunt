# Duck Hunt settings. Three main knobs:
#
#   [round] ducks         — how many ducks per round
#   [duck]  width/height  — how big the ducks are
#   [duck]  speed_min/max — how fast they fly
#
# All sizes and speeds are IN FRACTIONS OF THE SCREEN, not in pixels: 0.13 across
# = 13 % of the playfield width, a speed of 0.30 = a third of the screen per
# second. That is why the same numbers work the same in a window and in
# fullscreen, on a 27" monitor and on a 55" TV.
#
# Every key below has a comment saying what it does — nothing here is a magic
# number you have to read the source for.
#
# The file can be deleted — these same values are then used as defaults.
# A different set: python3 main.py --settings hard.toml
#
# WHERE THINGS ARE. The file is mostly comments, so here is the map
# — the game first, the machine last:
#
#   [round]       how long a round is, and how much ammunition it gives you
#   [score]       what a duck, a miss and the dog are worth
#   [duck]        size, speed, how many may be up at once, the strip they fly in
#   [dog]         his size, his band of grass, how long he pops up for
#   [scene]       background, fullscreen, which display, how the picture is fitted
#   [sound]       the shot, the quack, the laugh
#   [gun]         two different things, fenced apart inside the section:
#                   the FEEL   — spread, crosshair
#                   the RIG    — frame, beacon_w/h/cx/cy: where the LEDs are taped
#   [leaderboard] where the scoreboard is, if there is one
#   [mode]        what this round is called on the title screen
#
# The `[gun]` rig block is the only part that is about a particular room: it is
# what changes when the beacons move to another screen, and nothing else here has
# to change with it. A practice round is a short file laid over this one — see
# practice.toml — so a mode never has to repeat any of the above.
#
# MODES. This file is the round the game starts on; every other round is a short
# file laid over it — `practice.toml`, or anything dropped into `modes/`. The
# title screen cycles them (M, or A on the remote), so there is nothing to
# restart. A mode may only change `[round]`, `[duck]`, `[score]` and `[gun]
# crosshair`: the rig below — which monitor, where the beacons are taped, how far
# the gun shoots off them — is this room, not this round, and stays put whichever
# mode is being played.

# What the round in THIS file is called, when the title screen has more than one
# to offer. A mode file names itself the same way.
[mode]
name = "SCORED"
note = "the whole flock, shot down the sights — the one the board keeps"

[round]
# A round is `ducks` ducks; when the flock is gone you get the result, and the
# board next door is offered the row. Round length ≈ ducks × interval, i.e.
# about a minute for 100 × 0.6. ESC stops a round early and the result still
# counts, so a long round is not a trap.
ducks = 40           # ducks per round
interval = 0.9        # pause between launches, seconds

# Shots in the magazine. The round ends when the ducks run out or the magazine
# does, whichever comes first — the shot that empties it still counts, and a duck
# already falling still lands. 0 is unlimited, which is how this played before
# firing cost anything, and is what practice.toml goes back to.
#
# What is left is drawn as a belt of shells across the bottom-left corner, one
# shell per four shots, each shot taking a quarter off the leading one — so 40 is
# ten shells exactly. Change this and the belt changes length; it never puts more
# shots inside a shell. 0 draws no belt at all.
ammo = 40

# Whether the round is offered to the leaderboard at all. practice.toml turns this
# off: a round played by somebody who has never held the gun is not a record.
scored = true

speedup = 0.99         # 1.0 — a steady pace all round; 0.99 — speeds up towards the end
min_interval = 0.5    # the pace stops growing once the pause gets this short

# Seconds counted down between "start" and the first duck — time to get the gun
# up and settled. Every round begins the same way: the title screen waits for the
# trigger (SPACE works too), then this counts down, and that is true of the first
# round of the session and of every "play again" after it. 0 starts immediately.
countdown = 3.0

[score]
# What a shot is worth. Counting only the ducks made every shot free, so the way
# to a better score was to hold the trigger down; a miss costing a point is what
# makes aiming the game. The score may go negative and is shown negative —
# clamping it at zero would only hide that the round went badly.
duck = 2              # a duck downed
miss = -1             # a shot that hit nothing
dog = -5              # a shot that hit the dog. He is on your side, and he remembers.

[duck]
# Duck size. This is both the hitbox (used for hit detection) and the sprite size:
# the image is scaled up by a whole number of times to reach this width, so the
# sprite size changes in steps (0.09 and 0.11 give the same thing, while 0.13 is
# already bigger), whereas the hitbox changes smoothly.
width = 0.13          # width, fraction of screen width (0.13 ≈ NES proportions)
height = 0.16         # height, fraction of screen height
# Flight speed: each duck gets a random value between min and max.
# 0.30–0.55 means a duck crosses the screen in 2–3 seconds (for a one-minute round).
speed_min = 0.30      # slowest a duck may be, fraction of screen per second
speed_max = 0.65      # and the fastest

bob = 0.12            # vertical drift, ± fraction of screen per second
fall_speed = 0.7      # how fast a downed duck falls, fraction of screen per second

# How many ducks may be on screen at once. 0 — as many as `interval` launches,
# which is this round: a sky with four ducks in it. 1 makes the next duck wait
# until the last one is gone, which is practice.toml and the only thing in it
# that is a different mechanic rather than a different number.
max_alive = 0

# The strip the ducks fly in, measured from the TOP of the picture: 0.90 keeps
# them in the top 90 %, so the bottom tenth — the grass, where the dog is — stays
# clear. Ducks are launched inside this strip and bounce off its lower edge the
# same way they bounce off the top. It has to be taller than one duck (`height`
# above), or the whole picture is used instead.
sky = 0.90

[dog]
# The dog: the one that trots about on the title screen, brings back what you hit
# and laughs at what you miss.
#
# Its size is a fraction of the picture, like everything else here, so it keeps
# its proportions on a 27" monitor and on a 55" TV alike — it used to be a fixed
# 150 px, which is why it shrank as the picture grew. 0.12 is half again the size
# it came out at on a 1440p screen before.
width = 0.12          # dog width, fraction of screen width

# The bottom strip of the picture the dog is allowed in: 0.20 = the bottom fifth.
# It walks inside that band, and when it pops up out of the grass its head just
# reaches the band's top edge and no higher — so it never climbs into the ducks'
# sky. Together with [duck] sky above, this is what keeps the two apart.
band = 0.20

speed = 0.12          # how fast it walks the title screen, fraction of screen per second
pop = 1.4             # how long one pop-up (catch or laugh) lasts, seconds

# The dog that comes up out of the grass holding the ducks you shot, relative to
# `width` above: 1.2 = a fifth larger than the one walking the title screen. It
# is the reward for hitting something, so it reads better a little bigger. The
# dog that laughs at a miss stays at `width` — that one needs no help being
# noticed. It still may not leave the band: at the top of its arc its head
# reaches the band's ceiling and no further.
catch_scale = 1.2

[scene]
# Background: a name from assets/backgrounds/index.toml — meadow (a tree, blue
# sky), sunset (the same at sunset), mountains (mountains and a fir wood), clouds
# (clouds above tall grass). Two more values: "random" picks one at each launch,
# "none" uses the landscape drawn in code. In game the background cycles with B.
background = "meadow"

# Fullscreen or windowed. In fullscreen the scene is letterboxed whole and scaled
# by a whole number of times, so black bars are left at the edges — an NES picture
# cannot be stretched across a wide monitor without warping the pixels anyway.
fullscreen = true

# Which monitor to open on, counting from 0. SDL lists displays in its own order,
# and that order changes when one is plugged in or wakes from sleep, so leaving
# it to chance means the game sometimes comes up on the laptop and sometimes on
# the TV. -1 = let SDL choose, as it always did. The game prints the display it
# used and the sizes of all of them at startup:
#
#   display auto of 2 connected [(1470, 956), (1920, 1080)] — using 1920x1080
#
# so read the number off that line and put it here to pin it. With a light gun
# this is worth pinning: the beacons are taped to one particular screen.
display = -1

# The picture is fitted to the screen's HEIGHT, aspect kept, with bars on the
# sides only. The art pixels then land on a non-whole number of display pixels,
# so some come out a pixel bigger than others; the scaling is nearest-neighbour,
# so nothing is blurred. On a 16:9 screen this is 79% x 100% of it against
# 67% x 85% for a whole-number fit — the ducks come out about a fifth bigger,
# and it plays better, which is why the whole-number fit is no longer an option.

[sound]
# Three sounds: the gun going off, the duck's quack when it takes the shot, and
# the dog laughing at the one that got away. The files are assets/sounds/*.wav —
# synthesized, not sampled, by `python3 tools/make_sounds.py`, so they can be
# retuned (pitch, decay, formants) by editing that script and running it again.
#
# All the volumes are 0..1 and they multiply: a clip plays at `volume` x its own
# knob. So `volume` is the one to turn down for the room, and the three below it
# are the balance between them. Nothing here can break a round: if the files are
# missing or there is no audio device, the game prints one line and plays on in
# silence.
enabled = true        # false = a silent game; the files are not even loaded
volume = 0.7          # master volume
# The gun sits well below the other two on purpose. All three files are
# normalised to the same PEAK, but the shot carries ~5.7 dB more energy than the
# quack through its loudest tenth of a second — and it is the one you hear on
# every trigger pull, where the quack comes only when you connect. 0.55 puts it
# about 2 dB UNDER the quack. The bang is the one sound you hear on every single
# pull, so it is the one that wears you out first — it only has to be audible,
# not impressive, and the quack is the sound that should cut through it.
#
# shot.wav is not the cartridge's Zapper but a real gunshot from Wikimedia
# Commons (public domain) — a 190 ms crack instead of 300 ms of the NES noise
# channel. That is settled: it is a sharp transient with little average energy,
# which is why the number here is so much higher than the Zapper ever needed.
shot = 0.85           # the gun, relative to master
quack = 1.0           # the duck being hit
laugh = 1.0           # the dog at a miss

# Is the gun heard when you DO hit? true: every pull goes bang and a hit adds the
# quack on top — the bang is what tells you the trigger was read at all, which is
# worth having with a light gun three metres from the screen. false: a hit is the
# quack alone and the bang comes to mean "missed", which is the more informative
# pair of sounds once you trust the trigger.
shot_on_hit = true

[gun]
# The shot's radius, as a fraction of the playfield width: a duck falls when its
# hitbox comes within this of the aim point, not only when it swallows it. The
# crosshair circle is drawn at exactly this size, so what you see is what you
# hit, and the nearest duck in range is the one that drops. 0.04 against a duck
# 0.13 wide roughly triples the area it can be hit in; 0 is the old pinpoint.
# This one applies to the mouse as well.
spread = 0.02

# Whether the crosshair is drawn when the round starts — not a cosmetic setting
# any more. A scored round is shot DOWN THE SIGHTS: put the front sight on the
# duck, pull, and the screen tells you where it went. A round that had the
# crosshair up at any point OF THE ROUND is still played and still scored on
# screen, it is simply never offered to the leaderboard, and the results screen
# says so. C (or A on the remote) still flips it mid-round; it just costs the
# record, and flipping it back off does not buy it back. The title screen and
# the countdown are not the round — the crosshair is free there, so checking the
# gun is tracking before a round does not cost you that round.
#
#   "auto" — off when a gun is plugged in, on for the mouse. A mouse has no front
#            sight to aim down, so there the crosshair IS the aiming; those rounds
#            are therefore never records, which beats pretending a mouse and a
#            light gun are the same game.
#   "off"  — always down the sights, mouse included.
#   "on"   — always drawn, and nothing is ever offered to the board.
crosshair = "auto"

# The crosshair is drawn where the gun says the barrel is pointing, and nowhere
# else. Extrapolating it a few tens of milliseconds ahead along its own velocity
# was measured over two evenings and taken back out: it buys hit rate on paper
# and costs the one thing the sights are for — a crosshair thrown ahead of the
# barrel runs away from you whenever you move. The link's ~40-55 ms is paid for
# by standing the bridge closer instead (see the README).

# ===========================================================================
# THE RIG — everything above this line is how the game feels, everything below
# is where the hardware physically is. This is the only part of the file that is
# about one room: change it when the beacons move to another screen, and nothing
# else here has to change with it. `tools/ir_view.py --bezel` works the numbers
# out for you, and prints the exact line to paste below.
# ===========================================================================
#
# The rest is the light gun only (the mouse ignores it). The firmware solves the
# four-beacon homography and reports where the barrel points INSIDE THE BEACON
# RECTANGLE, 0..1 along its own two axes. This section says what that rectangle is against
# the game — the one thing that changes when the LEDs move to another screen, so
# it lives here and not in the firmware (no reflash to swap monitor for TV).
# Keep the firmware's own BEACON_CX/CY/W/H at 0.5/0.5/1.0/1.0.
#
# frame = "picture" — the LEDs are on the corners of the GAME'S PICTURE (the
#   letterboxed rectangle the ducks fly in, printed at startup). The gun's
#   numbers are then playfield fractions already and nothing below needs
#   changing: the same settings play on a 27" monitor and on a 55" TV, and
#   because the beacon rectangle is smaller than the screen you can stand
#   ~1.4x closer. Turn the game on and stick each beacon where the picture's
#   corner actually is.
# frame = "display" — the LEDs are on the corners of the PHYSICAL screen. The
#   game then takes the black bars out itself; play fullscreen, because a window
#   cannot be corrected (we do not know where it sits on screen).
frame = "display"

# If the LEDs ended up on some other rectangle — a TV frame that forces them
# wider, a bezel too thin to stick to, one corner blocked — describe it here: its
# size in widths/heights of that frame, and its centre as a fraction of it. LEDs
# spanning 68 cm across a 60 cm picture with frame = "picture" is
# beacon_w = 68/60 = 1.13. Getting these wrong does not break the aim, it skews
# it by a constant: the crosshair reaches the edge early, or never quite does.
#
# The rectangle must not be SMALLER than the picture, though (beacon_w below 1
# with frame = "picture"): the firmware clamps the aim to the beacon rectangle
# itself, so aiming past a beacon sticks there and the picture's outer band
# becomes unreachable: the beacons have to be at least as far apart as the
# picture's own corners.
# Measured for the 27": the beacons are on the bezel, 1 cm of it above the screen
# and 2 cm below, so the LED centres sit ~5 mm above the top edge, ~10 mm below
# the bottom and ~5 mm outside each side. That is a rectangle 1.7% wider and 4.5%
# taller than the screen, sitting 0.7% of the height low — which is what these
# four numbers say. Re-run the calculator if the LEDs end up elsewhere:
#
#   .venv/bin/python tools/ir_view.py --bezel 5 5 10 5 --diagonal 27
#                                   # top right bottom left, in mm, on that screen
beacon_w = 1.017      # beacon rectangle width, in widths of the frame above
beacon_h = 1.045      # its height, in heights of that frame
beacon_cx = 0.5       # its centre across, as a fraction of that frame
beacon_cy = 0.507     # its centre down, as a fraction of that frame


# ---------------------------------------------------------------------------
# [leaderboard] — the scoreboard, which is not part of the game
#
# The board is two processes of its own, meant for a screen of its own:
#
#   python3 -m leaderboard                                     # the server + the board
#
# The game asks WHO WAS SHOOTING once the round is over, posts one row, and draws
# nothing of what comes back — no ranks, no other players, no table. Two
# scoreboards disagreeing about which one to read is worse than one; see
# docs/LEADERBOARD.md.
#
# Off by default: with enabled = false the game never touches the network and
# behaves exactly as it did before the board existed. A round played with the
# server down is written to pending_runs.jsonl and reaches the board on the next
# launch — the run's own id makes a double-send harmless.
[leaderboard]
enabled = true                     # the board is up; false plays without it
url = "http://localhost:8420"      # the server; a Pi on the LAN is the same line
client_id = "eugene-mac"           # which cabinet this is, in the server's log
timeout = 2.0                      # seconds per attempt; three attempts, then the queue
